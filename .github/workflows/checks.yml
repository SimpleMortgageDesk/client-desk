name: Code checks

# Looks for coding mistakes (undefined names, duplicate keys, unreachable code) on every change to the site's code,
# and checks that the js/app-*.js files only use things that already exist when the page starts.
on:
  push:
    branches: [main]
    paths: ['js/**', '*.js', 'index.html', 'functions/**', 'tools/**', 'eslint.config.mjs', '.github/workflows/checks.yml']
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the checker
        run: npm install --no-save --no-package-lock eslint@9 globals acorn
      - name: Check the code
        run: npx eslint .
      - name: Check the order the app files load in
        run: node tools/check-code.mjs
