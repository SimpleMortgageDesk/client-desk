name: Android app

# Builds the Android app (a Trusted Web Activity that opens mysimpledesk.co.uk full screen).
# It runs whenever the android folder changes, and on demand: GitHub > Actions > "Android app" > Run workflow.
# Without the four signing secrets it still builds a test app (debug) so the build can be checked.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools (the build machine already has the Android SDK)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare the signing key (only when the secrets are set)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing key found: the release app will be signed."
          else
            echo "No signing key set: building the test app and an unsigned release only."
          fi

      - name: Build
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease

      - name: Show the signing fingerprint
        if: env.KEYSTORE_PATH != ''
        run: |
          {
            echo "### Signing fingerprint of the upload key"
            echo '```'
            keytool -list -v -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | grep -E "SHA256|Owner"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: MySimpleDesk-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # A plain download link for the test app, so it can be installed straight onto an Android phone.
      # Only the test (debug) app is published here. The signed app for Google Play stays in the build's private files.
      - name: Publish the test app for download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MySimpleDesk-test.apk
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test MySimpleDesk-test.apk --prerelease --target "$GITHUB_SHA" \
            --title "MySimpleDesk test app (Android)" \
            --notes "Test version of the Android app. Open this page on your Android phone, download MySimpleDesk-test.apk and install it (Android will ask you to allow installs from this source). It shows a thin address bar until the app is published on Google Play and linked to the website."
